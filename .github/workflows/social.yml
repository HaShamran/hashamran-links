# Relay pages, tweets and alerts. Scheduled every 15 minutes, but GitHub often delays scheduled runs by hours,
# so dud's publisher also starts it (workflow_dispatch, dry_run=false) every 30 minutes. Rules: pipeline/social.py.
name: social

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Decide but send nothing"
        type: boolean
        default: true
      check_buffer:
        description: "Only check the Buffer key and the @HaShamran1948 channel"
        type: boolean
        default: false

concurrency:
  group: social
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  social:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests
      - name: Relay pages and tweets
        id: run
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          if [ "${{ inputs.check_buffer }}" = "true" ]; then
            python pipeline/social.py --check-buffer
            exit $?
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python pipeline/social.py --dry-run
          else
            python pipeline/social.py
          fi
      - name: Save state
        if: always()
        run: |
          git config user.name "hashamran-bot"
          git config user.email "hashamran-bot@users.noreply.github.com"
          # One missing path makes git add refuse ALL paths, so add only files that exist (tweets.json is
          # created by the first tweet). Before this fix nothing was ever saved, relay pages never went up,
          # and every tweet waited for its relay page forever.
          for f in state/live.json state/tweets.json state/social-status.json ./*.html; do
            if [ -e "$f" ]; then git add -A -- "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -q -m "social: $(date -u +%FT%RZ)"
            for i in 1 2 3 4; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep $((i*3)); done
          fi
      - name: Raise alerts as an issue (GitHub emails the owner)
        if: always() && inputs.check_buffer != true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_OUTCOME: ${{ steps.run.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          if os.environ["RUN_OUTCOME"] == "success":
              try:
                  alerts = json.load(open("state/social-status.json")).get("alerts") or []
              except FileNotFoundError:
                  alerts = []
          else:
              alerts = [f"The social run failed: {os.environ['RUN_URL']}"]
          title = "HaShamran alert"
          found = subprocess.run(["gh", "issue", "list", "--state", "open", "--search", f"in:title {title}",
                                  "--json", "number,body"], capture_output=True, text=True, check=True)
          issues = json.loads(found.stdout or "[]")
          if not alerts:
              for i in issues:  # all clear: close the open alert
                  subprocess.run(["gh", "issue", "close", str(i["number"]), "--comment", "All clear."], check=True)
              raise SystemExit
          body = "\n".join(f"- {a}" for a in alerts)
          if not issues:
              subprocess.run(["gh", "issue", "create", "--title", title, "--body", body], check=True)
          elif issues[0]["body"].strip() != body.strip():
              subprocess.run(["gh", "issue", "edit", str(issues[0]["number"]), "--body", body], check=True)
              subprocess.run(["gh", "issue", "comment", str(issues[0]["number"]), "--body", "Alerts changed:\n" + body], check=True)
          PY
